version: '3.8'

services:
  sim-portfolio:
    build: .
    container_name: sim-portfolio
    environment:
      - TZ=Asia/Taipei
      - DATABASE_URL=${DATABASE_URL}
      # ─── 可觀測性（STANDARDS.md §3.5）────────────────────────
      - OTEL_TRACING_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    ports:
      - "8897:8897"
    restart: unless-stopped
    healthcheck:
      # 用 python urllib（base image python:3.12-slim 不含 curl）
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8897/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - infra-network
      - shioaji-network
      - ibapi-trading_default

networks:
  infra-network:
    external: true
  shioaji-network:
    external: true
  ibapi-trading_default:
    external: true
